name: Unit tests

on:
    workflow_dispatch:
      inputs:
        leg:
          description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
          type: choice
          options: [instrumented, baseline]
          default: instrumented
        profile:
          description: "CrashOverride chalk profile"
          type: string
          default: curiosity-tests-racecar
        racecar_run:
          description: "racecar correlation token, echoed into the run name"
          type: string
          default: ""
    pull_request:
        branches: [ master, stable-* ]
    push:
        branches: [ master, stable-* ]

permissions:
    contents: read
    pull-requests: write
    id-token: write

concurrency:
    group: unit-tests-${{ github.head_ref || github.run_id }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
    cancel-in-progress: false

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "Unit tests ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: crashappsec/action-checkout@main
              with:
                chalk: ${{ env.CHALK_ON }}
                profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
                observables_continue_on_error: false
                lfs: false
            - name: Assert instrumentation is live
              if: env.CHALK_ON == 'true'
              run: |
                test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
                test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

            - name: Set up JDK 21
              uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
              with:
                  distribution: "temurin"
                  java-version: 21

            - name: Delete old comments
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              if: ${{ always() }}
              run: scripts/deleteOldComments.sh "test" "Unit" ${{github.event.number}}

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

            - name: Run unit tests with coverage
              run: ./gradlew jacocoTestGplayDebugUnitTest

            - name: Upload failing results
              if: ${{ failure() }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: scripts/uploadReport.sh "${{ secrets.LOG_USERNAME }}" "${{ secrets.LOG_PASSWORD }}" ${{github.event.number}} "test" "Unit" ${{github.event.number}}

            - name: Upload coverage to codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  flags: unit
                  fail_ci_if_error: true
                  files: app/build/reports/jacoco/jacocoTestGplayDebugUnitTestReport/jacoco.xml

            - name: Upload jacoco artifacts
              if: ${{ failure() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: test-results
                  path: app/build/reports/jacoco/jacocoTestGplayDebugUnitTestReport/html/
